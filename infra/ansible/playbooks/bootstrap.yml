---
# bootstrap.yml — one-time provisioning of the Oracle Linux VM.
#
# Prereq: this playbook must run with python39 on the target and dnf via the
# CLI (the OL8 python39 stream has no python39-dnf bindings), i.e.:
#   ansible-playbook -e ansible_host=<ip> \
#     -e ansible_python_interpreter=/usr/bin/python3.9 \
#     -e app_image=ghcr.io/pavaram/munchi-birthday:dev \
#     playbooks/bootstrap.yml
# Safe to re-run; all tasks are idempotent.

- name: Bootstrap Munchi birthday VM
  hosts: munchi_vm
  become: true

  tasks:
    - name: Update all packages
      ansible.builtin.command:
        cmd: dnf --noplugins -y update
      register: update_result
      changed_when: "'Nothing to do' not in update_result.stdout"

    - name: Install EPEL repository (provides fail2ban)
      ansible.builtin.command:
        cmd: dnf --noplugins -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
      register: epel_result
      changed_when: "'already installed' not in epel_result.stdout"

    - name: Add Docker CE repository
      ansible.builtin.command:
        cmd: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Install base packages
      ansible.builtin.command:
        cmd: dnf --noplugins --setopt=install_weak_deps=0 -y install curl python39 docker-ce docker-ce-cli containerd.io docker-compose-plugin fail2ban dnf-automatic
      register: pkg_result
      changed_when: "'Nothing to do' not in pkg_result.stdout"

    - name: Enable automatic security updates (dnf-automatic)
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^apply_updates"
        line: "apply_updates = yes"

    - name: Restrict automatic updates to security errata only
      ansible.builtin.lineinfile:
        path: /etc/dnf/automatic.conf
        regexp: "^upgrade_type"
        line: "upgrade_type = security"

    - name: Start dnf-automatic timer
      ansible.builtin.systemd:
        name: dnf-automatic-install.timer
        enabled: true
        state: started

    - name: Disable Oracle Cloud Agent updater (avoids rpmdb contention on 1GB RAM)
      ansible.builtin.systemd:
        name: oracle-cloud-agent-updater
        enabled: false
        state: stopped

    - name: Enable and start docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add opc to docker group
      ansible.builtin.user:
        name: opc
        groups: docker
        append: true

    # ---- host firewall (firewalld; the OCI security list is the edge firewall) ----
    - name: Ensure firewalld is running
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Allow SSH through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port={{ ssh_port }}/tcp
      register: fw_result
      changed_when: false

    - name: Allow HTTP through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=80/tcp
      changed_when: false

    - name: Allow HTTPS through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=443/tcp
      changed_when: false

    - name: Reload firewalld to apply permanent rules
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      changed_when: false

    - name: Remove UFW package (unused; conflicts with firewalld)
      ansible.builtin.shell:
        cmd: rpm -q ufw >/dev/null 2>&1 && dnf --noplugins -y remove ufw || true
      register: ufw_remove
      changed_when: "'Removed' in ufw_remove.stdout"

    # ---- fail2ban (sshd) ----
    - name: Configure fail2ban jail for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 600
          findtime = 600
          maxretry = 5

          [sshd]
          enabled = true
          backend = systemd
      notify: restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # ---- SSH hardening ----
    - name: Disable password authentication for SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: restart sshd

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
      notify: restart sshd

    # ---- application directory + first deploy ----
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: "../../../docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Template .env
      ansible.builtin.template:
        src: "../templates/env.j2"
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Pull app image
      ansible.builtin.command:
        cmd: "docker compose -f {{ app_dir }}/docker-compose.yml pull app"
      environment:
        APP_IMAGE: "{{ app_image }}"
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pulled' in pull_result.stdout"

    - name: Start app container
      ansible.builtin.command:
        cmd: "docker compose -f {{ app_dir }}/docker-compose.yml up -d --no-deps app"
      environment:
        APP_IMAGE: "{{ app_image }}"

    - name: Wait for the site to be healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: 200
        timeout: 10
      register: result
      until: result.status == 200
      retries: 15
      delay: 2

    - name: Report deployment
      ansible.builtin.debug:
        msg: "Site is live. Point {{ domain }} at this VM's public IP, then TLS is handled automatically by Caddy."

  handlers:
    - name: restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
